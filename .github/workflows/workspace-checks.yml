name: Workspace Checks

on:
  workflow_call:

jobs:
  checks:
    name: Install, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Check seeds
        # The generated seeds must match what the generator produces. Without
        # this, "never hand-edit a generated seed" is advice; with it, a
        # hand-edit fails here with the drifted file named — which is how the
        # discover hero broke silently the last time one was treated as
        # editable.
        run: npm run check:seeds --workspace @edwardseshoka/samples
